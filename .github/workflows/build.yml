name: Build Mod from Zip
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Unzip project archive
        run: |
          unzip -q ObsidianModMenu-*.zip -d extracted_project
          cd extracted_project
          chmod +x gradlew
      - name: Build with Gradle
        run: |
          cd extracted_project
          ./gradlew build
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-mod-menu-jar
          path: extracted_project/build/libs/*.jar
          
